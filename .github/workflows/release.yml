name: Release private beta
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
concurrency:
  group: deinscomplete-production
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-go@v5
        with: { go-version: '1.22.x' }
      - run: npm ci && npm run compile && npm run lint && npm test && npm run release:validate && npm run package:vsix
      - run: cd api && go vet ./... && go test ./... && go test -race ./...
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"
      - uses: docker/build-push-action@v6
        with:
          context: api
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository }}/api:${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with: { name: vsix, path: '*.vsix' }
      - name: Deploy EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
          EC2_SSH_PRIVATE_KEY_BASE64: ${{ secrets.EC2_SSH_PRIVATE_KEY_BASE64 }}
          IMAGE: ghcr.io/${{ github.repository }}/api:${{ github.ref_name }}
        run: |
          test -n "$EC2_HOST"; test -n "$EC2_USER"; test -n "$EC2_KNOWN_HOSTS"; test -n "$EC2_SSH_PRIVATE_KEY_BASE64"
          install -m 700 -d ~/.ssh; printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts; printf '%s' "$EC2_SSH_PRIVATE_KEY_BASE64" | base64 --decode > ~/.ssh/id_ed25519; chmod 600 ~/.ssh/id_ed25519; ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          scp api/docker-compose.prod.yml api/Caddyfile scripts/deploy-production.sh "$EC2_USER@$EC2_HOST:/app/deinscomplete/"
          ssh "$EC2_USER@$EC2_HOST" "chmod +x /app/deinscomplete/deploy-production.sh && /app/deinscomplete/deploy-production.sh '$IMAGE'"
